        theme: {

    <style>
      /* Accessibility Classes */
      .acc-fontsize-large { font-size: 120%; }

      .acc-spacing-wide { letter-spacing: 0.1em !important; word-spacing: 0.2em !important; }

      .acc-grayscale { filter: grayscale(100%); }
      
      /* Sticky Footer fix */
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      main { flex: 1; }
